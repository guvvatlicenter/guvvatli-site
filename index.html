*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--sky);color:var(--paper);font-family:"Onest",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sky);z-index:10}
.stage{position:fixed;left:50%;bottom:0;transform:translateX(-50%);aspect-ratio:2400/1355;width:max(100vw,78vh*2400/1355);width:max(100vw,78svh*2400/1355);
background:url("chenlibel_bg.jpg") center/cover no-repeat}
@media (max-width:699px){.stage{background-image:url("chenlibel_bg_m.jpg")}}
.stage::before{content:"";position:absolute;inset:0 0 auto;height:26%;background:linear-gradient(var(--sky),rgba(26,35,40,0))}
.stage::after{content:"";position:absolute;inset:auto 0 0;height:18%;background:linear-gradient(rgba(16,22,26,0),rgba(16,22,26,.85))}
.peak{position:absolute;left:49.9%;top:35.6%;width:min(4.6%,6vh);transform:translate(-50%,-100%);filter:drop-shadow(0 0 18px rgba(198,242,107,.55))}
.peak .mk{display:block;width:100%;color:var(--lime);animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both .3s}
.peak::after{content:"";position:absolute;left:50%;top:50%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(rgba(198,242,107,.22),rgba(198,242,107,0) 65%);animation:pulse 4s ease-in-out infinite;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(30%)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.mk{display:inline-block;background:currentColor;-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat;aspect-ratio:1217/1237}
.page{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding-block:26px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{width:100%;max-width:1280px;margin-inline:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}
.lock{display:flex;align-items:center;gap:12px;color:var(--paper);text-decoration:none}
.lock .mk{width:38px}
.lock b{font-family:"Nunito",sans-serif;font-weight:900;font-size:23px;line-height:.92;display:block}
.lock i{font-family:"Nunito",sans-serif;font-weight:500;font-style:normal;font-size:14.5px;letter-spacing:.24em;display:block;margin-top:1px}
.langs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(16,22,26,.35);backdrop-filter:blur(6px)}
.langs button{all:unset;cursor:pointer;font-family:"Unbounded",sans-serif;font-size:11px;letter-spacing:.12em;padding:7px 11px;border-radius:999px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--lime);color:var(--ink)}
.langs button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
main{text-align:center;margin-top:clamp(10px,3vh,56px)}
h1{font-family:"Unbounded","Arial Black",sans-serif;font-weight:800;font-size:clamp(28px,min(4.6vw,6.6vh),62px);line-height:1;letter-spacing:-.025em;margin:0;text-wrap:balance;text-shadow:0 2px 30px rgba(10,16,18,.6)}
h1 span{color:var(--lime)}
.lead{font-size:clamp(15px,min(1.5vw,2.4vh),19px);line-height:1.5;color:#D5DEDA;max-width:32em;margin:12px auto 0;text-shadow:0 1px 16px rgba(10,16,18,.8)}
footer{margin-top:auto;width:100%;max-width:1280px;margin-inline:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 26px;font-size:13.5px;color:var(--muted);padding-top:14px}
footer b{color:var(--paper);font-weight:500;user-select:all}
@media (max-width:699px){.lock .mk{width:32px}.lock b{font-size:19px}.lock i{font-size:12px}.peak{width:6%}h1{font-size:32px}footer{font-size:12.5px;gap:2px 16px}}
@media (prefers-reduced-motion:reduce){.peak .mk,.peak::after{animation:none}}
</style>
</head>
<body>
<div class="stage" aria-hidden="true"><div class="peak"><span class="mk"></span></div></div>
<div class="page">
  <header class="top">
    <a class="lock" href="./" aria-label="Guvvatli Center"><span class="mk"></span><span><b>Guvvatli</b><i>Center</i></span></a>
    <div class="langs" role="group" aria-label="Dil">
      <button type="button" data-l="az" aria-pressed="true">AZ</button><button type="button" data-l="en" aria-pressed="false">EN</button><button type="button" data-l="ru" aria-pressed="false">RU</button>
    </div>
  </header>
  <main>
    <h1 data-t="h">Guvvatli Center <span>yenilənir</span></h1>
    <p class="lead" data-t="p">Qısa müddətdən sonra yenidən xidmətinizdə olacağıq.</p>
  </main>
  <footer>
    <span><span data-t="wa">Əlaqə (WhatsApp daxil)</span>: <b>+994 55 545 22 47</b></span>
    <span>E-poçt: <b>contact@guvvatli.az</b></span>
    <span>Instagram: <b>@guvvatli.center</b></span>
  </footer>
</div>
<script>
const T={az:{h:'Guvvatli Center <span>yenilənir</span>',p:'Qısa müddətdən sonra yenidən xidmətinizdə olacağıq.',wa:'Əlaqə (WhatsApp daxil)'},
en:{h:'Guvvatli Center <span>is being renewed</span>',p:'We will be back at your service very soon.',wa:'Contact (WhatsApp too)'},
ru:{h:'Guvvatli Center <span>обновляется</span>',p:'Совсем скоро мы снова будем к вашим услугам.',wa:'Связь (и WhatsApp)'}};
function setL(l){const t=T[l];if(!t)return;document.querySelector('[data-t="h"]').innerHTML=t.h;document.querySelector('[data-t="p"]').textContent=t.p;document.querySelector('[data-t="wa"]').textContent=t.wa;document.documentElement.lang=l;
document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));try{localStorage.setItem('gv_l',l)}catch(e){}}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>setL(b.dataset.l)));
try{const s=localStorage.getItem('gv_l');if(s)setL(s)}catch(e){}
</script>
</body>
