<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guvvatli Center</title>
<meta name="theme-color" content="#EAF7C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guvvatli Center">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/auto-render.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EC; --card:#FFFFFF; --ink:#10161A; --muted:#5D6B66; --line:#E4E1DA;
  --green:#0B5A3A; --green-deep:#073D28; --green-mid:#127A4F; --lime:#C6F26B; --lime-soft:#EAF7C8;
  --coral:#E4573D; --coral-soft:#FCE3DC; --teal:#0F8B84; --teal-soft:#DDF1EF; --indigo:#3B4A9C; --indigo-soft:#E3E7F7; --amber:#E9A23B; --amber-soft:#FBEBD0;
  --acc:#0B5A3A; --dark:#073D28; --pale:#E3F1EA; --page:#EAF7C8;
  --head:Unbounded,sans-serif; --sans:Onest,sans-serif;
  --key:#127C86; --accent:#E4573D;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --nav-h:68px;
}
body.a1{ --acc:#E4573D; --dark:#7A2213; --pale:#FDEBE6; --page:#FCE3DC; }
body.a2{ --acc:#0F8B84; --dark:#08433F; --pale:#E2F4F2; --page:#DDF1EF; }
body.b1{ --acc:#3F5BC4; --dark:#1F2F73; --pale:#E6EBFB; --page:#E1E7FA; }
body.b2{ --acc:#7A4BB8; --dark:#45246F; --pale:#F1E8FB; --page:#EDE3F9; }
body.langs{ --acc:#E4573D; --dark:#7A2213; --pale:#FDEBE6; --page:#FCE3DC; }
body.mth,body.riy{ --acc:#3B4A9C; --dark:#232D66; --pale:#E8EBF8; --page:#E3E7F7; }
body.ai{ --acc:#127A4F; --dark:#073D28; --pale:#E4F9B6; --page:#E4F9B6; }
body.olp{ --acc:#B5531B; --dark:#6E2F0B; --pale:#FBEBDD; --page:#FBEBD0; }
@media (prefers-color-scheme:dark){
  :root{ --bg:#0F1315; --card:#1A1F22; --ink:#ECEEF0; --muted:#9AA6A1; --line:#2A3034; --pale:#1F2A25; --page:#18210F; --lime-soft:#1E2A12; --coral-soft:#33201B; --teal-soft:#122C2A; --indigo-soft:#1C2140; --amber-soft:#33260F; }
  body.a1,body.langs{ --pale:#2A1B18; --page:#26150F; } body.a2{ --pale:#11302E; --page:#0F2524; } body.b1{ --pale:#1B2244; --page:#141A36; } body.b2{ --pale:#2A1D40; --page:#1F1633; } body.mth,body.riy{ --pale:#1C2140; --page:#161A33; } body.olp{ --pale:#33200F; --page:#2A1A0B; } body.ai{ --pale:#1E2A12; --page:#18210F; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:calc(var(--nav-h) + 40px + var(--safe-b));min-height:100vh;background:linear-gradient(180deg,var(--page) 0,var(--page) 300px,var(--bg) 620px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
/* header */
header{position:sticky;top:0;z-index:5;padding-top:calc(10px + var(--safe-t));padding-bottom:8px;background:var(--page);transition:background .3s}
.top{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:48px}
.sq{width:46px;height:46px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(16,22,26,.08)}
.sq svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sq img{width:28px;height:28px}
.htitle{text-align:center;font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.lsel{position:relative}
.ibtn{height:46px;display:flex;align-items:center;gap:6px;background:var(--lime);color:#10161A;border-radius:16px;padding:0 12px;font-family:Unbounded,sans-serif;font-weight:700;font-size:11px;box-shadow:0 4px 14px rgba(16,22,26,.08)}
.ibtn[hidden]{display:none}
.ibtn svg{width:18px;height:18px;stroke:#10161A;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top{grid-template-columns:48px minmax(0,1fr) auto}
@media (max-width:400px){.ibtn span{display:none}.ibtn{padding:0 12px}.row{gap:10px;padding:11px 10px}.row .tag{font-size:10px;padding:3px 7px}.row .go{display:none}}
.row .ri.stk{width:72px;min-width:72px;flex:0 0 72px;height:46px;background:none;position:relative;overflow:visible}
.row .ri.stk img{position:absolute;width:27px;height:37px;object-fit:cover;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.lbtn{height:46px;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:16px;padding:0 10px;font-family:Unbounded,sans-serif;font-weight:700;font-size:11px;box-shadow:0 4px 14px rgba(16,22,26,.08)}
.flag{width:24px;height:16px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.08);flex-shrink:0}
.lmenu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.18);padding:6px;z-index:30;min-width:180px}
.lmenu[hidden]{display:none}
.lmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:12px;font-size:14px;font-weight:600;text-align:left}
.lmenu button.on{background:var(--pale)}
/* page heads */
.ph{margin:10px 2px 0}
.ph h2{font-family:Unbounded,sans-serif;font-weight:700;font-size:clamp(28px,8.4vw,40px);line-height:1.06;letter-spacing:-0.02em;margin:0}
.ph h2 span{color:var(--acc)}
.ph.hm{text-align:center}
.ph.hm h2{font-size:clamp(24px,7vw,34px);line-height:1.12;text-wrap:balance}
.ph.hm p{margin-left:auto;margin-right:auto}
.ph.hm h2 span{color:var(--green-mid)}
.ph p{margin:8px 0 0;color:var(--ink);opacity:.72;font-size:15px;line-height:1.45;max-width:520px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:44px;border-radius:999px;background:var(--card);padding:0 16px 0 14px;font-weight:600;font-size:14px;box-shadow:0 3px 10px rgba(16,22,26,.06)}
.chip.ic{width:44px;padding:0;justify-content:center}
.chip svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.lm{background:var(--lime);color:var(--ink)}
/* stacked card (reference look) */
.stack{position:relative;margin-top:22px;padding-top:44px}
.stack .bk{position:absolute;left:10px;right:34px;height:110px;border-radius:26px;top:0}
.stack .bk.b1{background:#F6C6D6;transform:rotate(-3deg);top:-2px;left:22px;right:40px}
.stack .bk.b2{background:#C9D8F5;transform:rotate(-1deg);top:20px;left:12px;right:26px}
.stack .bk i{position:absolute;right:22px;top:16px;width:22px;height:22px}
.stack .bk i svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;opacity:.75}
.front{position:relative;border-radius:28px;padding:18px 14px 14px;background:var(--fc,#A9C87A);color:var(--ink);box-shadow:0 18px 40px rgba(16,22,26,.12)}
.front .fh{display:flex;align-items:center;justify-content:space-between;padding:0 6px 12px}
.front .fh b{font-family:Unbounded,sans-serif;font-weight:700;font-size:18px}
.front .fh span{font-size:13px;font-weight:600;opacity:.7}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px;border-radius:18px;background:rgba(255,255,255,.42);text-align:left;color:var(--ink)}
.row:first-child{background:rgba(255,255,255,.88)}
.row .ri{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .ri svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row .ri img{width:30px;height:40px;object-fit:cover;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.row .rt2{flex:1;min-width:0}
.row .rt2 b{display:block;font-size:15px;font-weight:700}
.row .rt2 small{display:block;font-size:12.5px;opacity:.72;margin-top:1px;line-height:1.35}
.row .go{font-size:20px;opacity:.6}
.row .tag{font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px;background:rgba(16,22,26,.08);white-space:nowrap}
.row .tag.ok{background:var(--ink);color:#fff}
.row.soon{opacity:.62;cursor:default}
@media (prefers-color-scheme:dark){ .front{color:#10161A} .row,.row .rt2 b{color:#10161A} .front .ri svg{stroke:#10161A} .nav{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.5)} }
.chip.dk{background:#10161A;color:#fff}
/* tiles grid */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.lvc{position:relative;border-radius:24px;padding:14px;min-height:170px;text-align:left;display:flex;flex-direction:column;gap:6px;color:#10161A;overflow:hidden}
.lvc img{position:absolute;right:-14px;bottom:-12px;width:88px;height:120px;object-fit:cover;border-radius:10px;transform:rotate(8deg);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.lvc b{font-family:Unbounded,sans-serif;font-size:32px;line-height:1}
.lvc small{font-size:12.5px;font-weight:600;opacity:.75;max-width:62%}
.lvc .st{position:relative;z-index:2;margin-top:auto;align-self:flex-start;font-size:11px;font-weight:700;border-radius:999px;padding:5px 10px;background:rgba(255,255,255,.75)}
.lvc.soon{cursor:default}
.lvc.soon img{filter:grayscale(.3);opacity:.8}
.card2{background:var(--card);border-radius:24px;padding:16px;margin-top:14px;display:flex;gap:14px;align-items:center;text-align:left;width:100%;box-shadow:0 6px 18px rgba(16,22,26,.06)}
.card2 .pl{width:48px;height:48px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card2 .pl svg{width:22px;height:22px;fill:#fff}
.card2 b{display:block;font-size:15px}
.card2 small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.note{color:var(--muted);font-size:13px;line-height:1.5;margin:14px 4px 0}
/* controls */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border-radius:18px;padding:5px;margin-top:10px;box-shadow:0 3px 10px rgba(16,22,26,.05)}
.seg button{border-radius:14px;padding:10px 0;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.lv{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid transparent;border-radius:18px;padding:8px;text-align:left;box-shadow:0 3px 10px rgba(16,22,26,.05)}
.lv img{width:38px;height:52px;object-fit:cover;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.18);background:var(--line)}
.lv b{display:block;font-family:Unbounded,sans-serif;font-size:19px;line-height:1}
.lv small{color:var(--muted);font-size:12px}
.lv.on{border-color:var(--acc)}
.grades{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.grades::-webkit-scrollbar{display:none}
.grades button{flex:0 0 auto;min-width:48px;height:48px;border-radius:16px;background:var(--card);font-family:Unbounded,sans-serif;font-weight:700;font-size:16px;box-shadow:0 3px 10px rgba(16,22,26,.05)}
.grades button.on{background:var(--ink);color:#fff}
.search{margin-top:10px}
.search input{width:100%;font:inherit;font-size:16px;padding:13px 16px;border-radius:18px;border:0;background:var(--card);color:var(--ink);outline:none;box-shadow:0 3px 10px rgba(16,22,26,.05)}
.search input:focus{box-shadow:0 0 0 2px var(--acc)}
/* lists */
.unit{background:var(--card);border-radius:22px;margin-top:10px;overflow:hidden;box-shadow:0 4px 14px rgba(16,22,26,.05)}
.uh{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left}
.un{font-family:Unbounded,sans-serif;font-weight:800;font-size:16px;color:var(--dark);background:var(--pale);border-radius:14px;min-width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.ut{flex:1;min-width:0}
.ut b{display:block;font-size:15px}
.ut small{color:var(--muted);font-size:12.5px}
.chev{transition:transform .2s;color:var(--muted);font-size:20px}
.unit.open .chev{transform:rotate(90deg)}
.tracks{display:none;border-top:1px solid var(--line)}
.unit.open .tracks{display:block}
.tr{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tn{font-family:Unbounded,sans-serif;font-weight:700;font-size:12px;background:var(--pale);color:var(--dark);border-radius:10px;padding:6px 8px;min-width:52px;text-align:center}
.tt{flex:1;font-size:14.5px;line-height:1.35}
.tr.playing{background:var(--pale)}
.tr.playing .tt{font-weight:700}
.org{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--dark);background:var(--pale);border-radius:999px;padding:4px 9px;white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.off{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);font-size:13px;color:var(--muted)}
.off button{font-weight:700;color:var(--acc);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.count{color:var(--muted);font-size:13px;margin:14px 4px 0}
/* detail */
.det h2{font-family:Unbounded,sans-serif;font-size:22px;line-height:1.25;margin:10px 2px 8px}
.det .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;margin:0 2px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-top:12px;box-shadow:0 4px 14px rgba(16,22,26,.05);overflow-wrap:anywhere}
.card h3{font-family:Unbounded,sans-serif;font-size:12px;letter-spacing:.05em;color:var(--acc);margin:0 0 8px;text-transform:uppercase}
.card p{margin:0 0 10px;line-height:1.62;font-size:15.5px}
.card p:last-child{margin-bottom:0}
.vis{overflow-x:auto;margin-top:6px;text-align:center}
.vis svg{max-width:100%;height:auto;width:auto!important}
.steps{display:flex;flex-direction:column;gap:8px}
.steps p{margin:0;padding-left:14px;border-left:3px solid var(--pale)}
.q{font-weight:700;font-size:15.5px;line-height:1.55;margin:0 0 10px}
.ans{margin-top:12px;background:var(--pale);border-radius:14px;padding:10px 12px;font-weight:700}
.two{display:grid;gap:10px}
.way{border-radius:16px;padding:12px;background:var(--bg)}
.way.k{background:var(--pale)}
.way b{display:block;font-family:Unbounded,sans-serif;font-size:12px;margin-bottom:6px;color:var(--dark)}
.way p{margin:0 0 6px;font-size:14.5px;line-height:1.55}
.math{font-family:Unbounded,sans-serif;font-weight:600;font-size:.88em;white-space:normal;overflow-wrap:anywhere}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.9em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px 1px}
.fr>span:last-child{padding:1px 2px 0}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.navrow button{flex:1;background:var(--card);border-radius:16px;padding:13px;font-weight:600;font-size:14px;box-shadow:0 3px 10px rgba(16,22,26,.05)}
.motto{color:var(--muted);font-size:12px;text-align:center;margin:26px 0 6px}
/* olympiad */
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.oc{background:var(--card);border-radius:22px;padding:14px;text-align:left;min-height:100px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 14px rgba(16,22,26,.05)}
.oc b{font-family:Unbounded,sans-serif;font-size:15px;line-height:1.25}
.oc small{color:var(--muted);font-size:12.5px}
.oc .n{margin-top:auto;font-size:12px;font-weight:700;color:var(--acc)}
.osec{font-family:Unbounded,sans-serif;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);margin:20px 4px 8px}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{background:var(--card);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;text-align:left;box-shadow:0 3px 10px rgba(16,22,26,.05)}
.kchip i{font-style:normal;color:var(--muted);font-weight:500;margin-left:6px;font-size:12px}
.pq{background:var(--card);border-radius:22px;padding:14px;margin-top:10px;box-shadow:0 4px 14px rgba(16,22,26,.05)}
.pq .src{font-size:12px;color:var(--muted);margin-bottom:6px}
.pq .tx{font-size:15px;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.opts>span{background:var(--bg);border-radius:12px;padding:9px 11px;font-size:14px}
.opts>span.ok{background:var(--pale);font-weight:700;box-shadow:inset 0 0 0 2px var(--acc)}
.pbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pbtn button{background:var(--bg);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
.pbtn button.k{color:var(--acc)}
.reveal{margin-top:10px;background:var(--pale);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.55}
.reveal p{margin:0 0 6px}
.katex{font-size:1.06em}
.tx,.reveal,.card p,.steps p,.way p{line-height:1.75}
.opts>span .katex{font-size:1em}
.fig{background:#fff;border-radius:14px;padding:8px;margin-top:10px;text-align:center}
.fig svg{max-width:100%;height:auto;max-height:260px}
.opts>span svg{max-width:100%;height:auto;max-height:90px;background:#fff;border-radius:8px}
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:block;background:var(--card);border-radius:18px;padding:12px 14px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;box-shadow:0 3px 10px rgba(16,22,26,.05)}
.links a small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px;word-break:break-all}
.sets{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sets::-webkit-scrollbar{display:none}
.sets button{flex:0 0 auto;background:var(--card);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:600;box-shadow:0 3px 10px rgba(16,22,26,.05)}
.sets button.on{background:var(--ink);color:#fff}
.qn{font-family:Unbounded,sans-serif;font-weight:700;font-size:12px;color:var(--acc)}
.more{width:100%;margin-top:12px;background:var(--card);border-radius:16px;padding:13px;font-weight:600;box-shadow:0 3px 10px rgba(16,22,26,.05)}
.oinfo{background:var(--card);border-radius:20px;padding:12px 14px;margin-top:12px;box-shadow:0 4px 14px rgba(16,22,26,.05)}
.oinfo .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--pale);color:var(--dark)}
.oinfo p{margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--muted)}

/* ---------------- crypto ---------------- */
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
let KEYS=null; const DK={};
async function loadKeys(){ if(KEYS) return KEYS; KEYS=await fetch('d/keys.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>caches.match('d/keys.json').then(r=>r&&r.json())); return KEYS }
async function aesKey(raw){ return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']) }
async function dec(key,buf){ const u=new Uint8Array(buf); return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)) }
async function tryPassword(sec,pw){
  await loadKeys(); const enc=new TextEncoder().encode(pw.trim().toUpperCase());
  const base=await crypto.subtle.importKey('raw',enc,'PBKDF2',false,['deriveKey']);
  for(const w of (KEYS[sec]||[])){
    try{ const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(w.s),iterations:w.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(w.v)},kek,b64d(w.w)); store.set('k_'+sec,b64e(raw)); DK[sec]=await aesKey(raw); return true }catch(e){}
  }
  return false;
}
async function getKey(sec){ if(DK[sec]) return DK[sec]; const s=store.get('k_'+sec,null); if(!s) return null; DK[sec]=await aesKey(b64d(s)); return DK[sec] }
const isOpen=sec=>!!store.get('k_'+sec,null);
async function gunzip(buf){ const ds=new DecompressionStream('gzip'); const st=new Blob([buf]).stream().pipeThrough(ds); return new Response(st).text() }
async function fetchBin(url){ const r=await fetch(url,{cache:'no-cache'}).catch(()=>null); if(r&&r.ok) return r.arrayBuffer(); const c=await caches.match(url); if(c) return c.arrayBuffer(); throw new Error('net') }
async function loadSec(sec,file){ const k=await getKey(sec); if(!k) return null; try{ return JSON.parse(await gunzip(await dec(k,await fetchBin(file)))) }catch(e){ store.del('k_'+sec); delete DK[sec]; return null } }
function askPassword(sec){
  return new Promise(res=>{
    $('pwH').textContent=t('pw_h');$('pwP').textContent=t('pw_p');$('pwOk').textContent=t('pw_ok');$('pwCancel').textContent=t('pw_cancel');$('pwErr').textContent='';$('pwIn').value='';
    $('pwSheet').hidden=false; setTimeout(()=>$('pwIn').focus(),50);
    const done=v=>{$('pwSheet').hidden=true;$('pwOk').onclick=null;res(v)};
    $('pwCancel').onclick=()=>done(false);
    const go=async()=>{ $('pwErr').textContent=t('pw_wait'); const ok=await tryPassword(sec,$('pwIn').value); if(ok) done(true); else $('pwErr').textContent=t('pw_err') };
    $('pwOk').onclick=go; $('pwIn').onkeydown=e=>{if(e.key==='Enter')go()};
  });
}
async function ensure(sec){ if(await getKey(sec)) return true; return askPassword(sec) }
